<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>葺合国際科｜英語学習ノート</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#253348;background:#f5f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.wrap{max-width:920px;margin:auto;padding:20px 16px 105px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.12em;color:#66758c;font-weight:800}h1{font-size:22px;margin:4px 0 15px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:15px 0 9px}.card{background:white;border:1px solid #e4e9f0;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 4px 14px #1e355208}.hero{background:linear-gradient(135deg,#284d87,#5479b1);color:white;border:0}.hero small{color:#e3ebff}.metric{font-size:34px;font-weight:800}.metric small{font-size:14px;font-weight:500}.bar{height:11px;border-radius:20px;background:#dfe5ef;overflow:hidden;margin:13px 0}.bar>div{height:100%;background:#61c3a4;transition:width .2s}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{border-radius:12px;background:#f4f6fb;padding:13px}.tile strong{display:block;font-size:21px;margin-top:6px}.muted{font-size:13px;color:#67758a;line-height:1.6}.hero .muted{color:#e0eaff}.btn{border:0;border-radius:11px;padding:12px 15px;font-size:14px;font-weight:750}.primary{background:#3567a8;color:#fff}.soft{background:#e8effa;color:#315c94}.light{background:#f0f2f6;color:#526176}.ghost{border:1px solid #d5dce8;background:white;color:#3e5f89}.small{padding:8px 11px;font-size:12px}.field{display:block;font-size:13px;font-weight:750;margin:12px 0}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd6e4;border-radius:10px;padding:11px;margin-top:6px;background:white;color:#24344b;font-size:16px}.field textarea{min-height:76px;resize:vertical}.hidden{display:none!important}.tag{font-size:12px;border-radius:100px;padding:5px 9px;background:#eaf0f9;color:#356099;white-space:nowrap}.tag.test{background:#fff0db;color:#98651d}.tag.eiken{background:#efeaff;color:#694eab}.tag.travel{background:#e5f4ee;color:#25745b}.tag.holiday{background:#fcecf1;color:#9b5171}.tag.exam{background:#f0f2f5;color:#657080}.notice{background:#fff4e1;color:#80571e;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}.good{background:#e8f5ee;color:#267052}.blockgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.block{border:1px solid #d9e2ef;background:#f6f8fc;border-radius:11px;padding:12px 4px;text-align:center;color:#29405f;font-size:12px}.block b{display:block;font-size:14px}.block.done{background:#dff4e9;color:#237657;border-color:#9ed9bb}.block.next{outline:2px solid #5281bc}.line{padding:12px 0;border-bottom:1px solid #edf0f5}.line:last-child{border-bottom:0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:47px;text-align:center;background:#f3f5f9;border-radius:9px;padding:7px 1px;font-size:12px}.day.studied{background:#dff4e9;color:#217052}.day.event{box-shadow:inset 0 -4px #edbc67}.day.today{outline:2px solid #527cb5}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e1e7ef;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{min-width:65px;flex:1;max-width:130px;background:none;border:0;padding:10px 4px;color:#75829a;font-size:12px;font-weight:700}.nav button.active{color:#315f9f;border-top:3px solid #315f9f}.status{font-size:12px;color:#61728b;margin:8px 0}.rowbtns{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:11px;color:#728097}.eventitem{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.parentOnly{border-left:3px solid #80a3d0;padding-left:11px}.kpi{font-weight:800;color:#3567a8}.sep{border:0;border-top:1px solid #e9edf4;margin:16px 0}@media(min-width:650px){.wrap{padding:30px 25px 110px}.grid{grid-template-columns:repeat(3,1fr)}.blockgrid{grid-template-columns:repeat(6,1fr)}}
</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">FUKIAI INTERNATIONAL · STUDY TRACKER</div><h1>英語学習ノート</h1></div><button class="btn ghost small" id="roleBtn">保護者画面</button></div><div id="connection" class="status"></div><section id="login" class="card"><h2>はじめに接続しよう</h2><p class="muted">Googleスプレッドシートに学習記録を保存するため、Apps ScriptのURLと家族用の合言葉を入力してください。家族専用端末では、初回接続後に次回から自動接続します。</p><label class="field">Apps ScriptのウェブアプリURL<input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label class="field">家族用の合言葉<input id="pin" type="password" autocomplete="off" placeholder="Google Apps Scriptで設定した文字列"></label><label style="font-size:13px"><input type="checkbox" id="rememberEndpoint" checked> この端末に接続情報を保存して次回から自動接続する</label><div style="margin-top:14px"><button id="connectBtn" class="btn primary">接続する</button></div><p class="tiny">GitHubには学習履歴・合言葉を保存しません。接続情報はこの端末のブラウザ内に保存されます。共有端末では使用しないでください。</p></section><div id="app" class="hidden"><section id="home"></section><section id="vocab" class="hidden"></section><section id="skills" class="hidden"></section><section id="calendar" class="hidden"></section><section id="review" class="hidden"></section><section id="parent" class="hidden"></section><button id="disconnectBtn" class="btn light small" style="margin-top:12px">接続を解除</button></div></main><nav id="nav" class="nav hidden"><button data-tab="home">🏠<br>今日</button><button data-tab="vocab">📖<br>単語</button><button data-tab="skills">✏️<br>6分野</button><button data-tab="calendar">📅<br>予定</button><button data-tab="review">🌱<br>振返り</button><button data-tab="parent">📊<br>保護者</button></nav><script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SKILLS=['リスニング','リーディング・速読','リーディング・精読','ライティング','スピーキング','社会・国際問題'];
let endpoint='',pin='',state=null,role='student',tabName='home',monthOffset=0,busy=false,queue=new Map();
$('endpoint').value=localStorage.getItem('fukiaiEndpoint')||'';
$('pin').value=localStorage.getItem('fukiaiFamilyPin')||'';
$('roleBtn').onclick=()=>{role=role==='student'?'parent':'student';tabName=role==='parent'?'parent':'home';render()};
async function connect(silent=false){endpoint=$('endpoint').value.trim();pin=$('pin').value;if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(endpoint)){if(!silent)alert('Apps Scriptの /exec で終わるURLを入力してください');return}if(!pin){if(!silent)alert('合言葉を入力してください');return}const btn=$('connectBtn');btn.disabled=true;btn.textContent='接続中…';try{state=await request('getState');if($('rememberEndpoint').checked){localStorage.setItem('fukiaiEndpoint',endpoint);localStorage.setItem('fukiaiFamilyPin',pin)}else{localStorage.removeItem('fukiaiEndpoint');localStorage.removeItem('fukiaiFamilyPin')}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('connection').textContent='接続しました';render()}catch(e){if(silent){localStorage.removeItem('fukiaiFamilyPin');$('pin').value='';pin='';$('connection').textContent='自動接続できませんでした。合言葉を確認してください。'}else alert('接続できませんでした：'+e.message)}finally{btn.disabled=false;btn.textContent='接続する'}}
$('connectBtn').onclick=()=>connect(false);
if($('endpoint').value&&$('pin').value){$('connection').textContent='自動接続中…';connect(true)}
$('disconnectBtn').onclick=()=>{localStorage.removeItem('fukiaiFamilyPin');localStorage.removeItem('fukiaiEndpoint');$('endpoint').value='';pin='';state=null;$('pin').value='';$('app').classList.add('hidden');$('nav').classList.add('hidden');$('login').classList.remove('hidden');$('connection').textContent='接続を解除しました'};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tabName=b.dataset.tab;render()});
// Cross-origin Apps Script bridge: hidden form POST -> HTMLService iframe -> postMessage.
// No permissive CORS server or published spreadsheet is required.
// Normalize Google Sheets dates to local YYYY-MM-DD before comparing or displaying.
function normalizeDate(value){
  const s=String(value??'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const d=new Date(s);
  if(Number.isNaN(d.getTime()))return s;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normalizeState(data){
  if(!data||!Array.isArray(data.events))return data;
  data.events.forEach(e=>{e.start=normalizeDate(e.start);e.end=normalizeDate(e.end)});
  if(Array.isArray(data.skills))data.skills.forEach(x=>x.date=normalizeDate(x.date));
  if(Array.isArray(data.reviews))data.reviews.forEach(x=>x.week=normalizeDate(x.week));
  return data;
}
function shortDate(value){const s=normalizeDate(value);return /^\d{4}-\d{2}-\d{2}$/.test(s)?Number(s.slice(5,7))+'/'+Number(s.slice(8,10)):s}
function request(action,data={}){return new Promise((resolve,reject)=>{if(!endpoint||!pin){reject(Error('未接続です'));return}const id='r'+Date.now()+'_'+Math.random().toString(36).slice(2),frame=document.createElement('iframe');frame.style.display='none';frame.name='frame_'+id;frame.title='通信';document.body.appendChild(frame);const form=document.createElement('form');form.method='POST';form.action=endpoint;form.target=frame.name;form.style.display='none';const add=(k,v)=>{const i=document.createElement('input');i.name=k;i.value=v;form.appendChild(i)};add('requestId',id);add('payload',JSON.stringify({action,data,pin}));document.body.appendChild(form);const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',handler);form.remove();frame.remove()};const handler=e=>{if(!/^https:\/\/(script\.google\.com|[a-z0-9.-]*googleusercontent\.com)$/.test(e.origin))return;let msg;try{msg=JSON.parse(e.data)}catch{return}if(msg.kind!=='FUKIAI_APP_RESPONSE'||msg.requestId!==id)return;cleanup();if(msg.result.ok)resolve(normalizeState(msg.result.data));else reject(Error(msg.result.error||'保存できませんでした'))};window.addEventListener('message',handler);const timer=setTimeout(()=>{cleanup();reject(Error('通信がタイムアウトしました。URLと公開設定を確認してください'))},30000);form.submit()})}
async function save(action,data){if(busy)return;busy=true;$('connection').textContent='保存中…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{state=await request(action,data);render();$('connection').textContent='Googleスプレッドシートに保存しました'}catch(e){alert('保存できませんでした：'+e.message);$('connection').textContent='保存に失敗しました'}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function today(){return state.today}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dayAdd(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function currentEvents(date){return state.events.filter(e=>e.start<=date&&date<=e.end)}
function modeAt(date){const active=currentEvents(date);for(const m of ['travel','test','eiken','holiday'])if(active.some(e=>e.mode===m))return m;return 'normal'}
const MODE={normal:['通常学習','学校と葺合対策をバランスよく'],test:['定期テスト優先','はば単は5〜12語程度でもOK。学校の勉強を優先'],eiken:['英検面接優先','面接対策を中心に。はば単は少量でもOK'],holiday:['長期休暇','無理のない範囲で学習を進めよう'],travel:['旅行・体験期間','通常の学習ノルマはお休み。現地での英語体験を大切に']};
function totals(){const done=state.blocks.filter(b=>b.done),count=done.reduce((n,b)=>n+b.end-b.start+1,0),next=state.blocks.find(b=>!b.done);return{done,count,next,percent:Math.round(count/state.total*100)}}
function target(){const t=totals(),remaining=state.total-t.count,deadline=state.deadline,now=today();let days=0;for(let d=now;d<=deadline;d=dayAdd(d,1)){const m=modeAt(d);if(m==='normal'||m==='holiday')days++;}return {remaining,days,pace:days?Math.ceil(remaining/days/12)*12:0}}
function render(){if(!state)return;const t=totals(),g=target();$('roleBtn').textContent=role==='student'?'保護者画面':'学習者画面';if(role==='student'&&tabName==='parent')tabName='home';$('nav').querySelector('[data-tab="parent"]').classList.toggle('hidden',role!=='parent');['home','vocab','skills','calendar','review','parent'].forEach(k=>$(k).classList.toggle('hidden',tabName!==k));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabName));renderHome(t,g);renderVocab(t);renderSkills();renderCalendar();renderReview();renderParent(t,g)}
function goto(k){tabName=k;render();window.scrollTo(0,0)}
function eventList(items,limit=5){return items.slice(0,limit).map(e=>`<div class="line"><div class="eventitem"><div><span class="tag ${esc(e.mode)}">${esc(shortDate(e.start))}${e.end!==e.start?'〜'+esc(shortDate(e.end)):''}</span><div style="margin-top:6px"><b>${esc(e.title)}</b></div><div class="muted">${esc(e.detail)}</div></div></div></div>`).join('')||'<p class="muted">予定はありません</p>'}
function renderHome(t,g){const m=modeAt(today()),next=t.next,upcoming=state.events.filter(e=>e.end>=today()).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,4);const suggested=m==='travel'?0:m==='test'||m==='eiken'?12:Math.max(12,g.pace||12);$('home').innerHTML=`<div class="card hero"><h2>はば単2500・仕分け1周目</h2><div class="metric">${t.count.toLocaleString()} <small>/ 2,500語</small></div><div class="bar"><div style="width:${t.percent}%"></div></div><div class="flex"><b>${t.percent}% 完了</b><small>目標 2026/12/31</small></div></div><div class="card"><div class="flex"><h2>今日の学習モード</h2><span class="tag ${m}">${MODE[m][0]}</span></div><p class="muted">${MODE[m][1]}</p>${m==='test'?'<div class="notice">平日は塾2コマ（自習室・授業を含む）を優先する期間です。</div>':''}${m==='travel'?'<div class="notice good">学習ノルマは0。英語を使った体験は6分野の記録に残せます。</div>':''}</div><div class="grid"><div class="tile">残りの語数<strong>${g.remaining.toLocaleString()}</strong></div><div class="tile">通常・休暇の残り日数<strong>${g.days}日</strong></div><div class="tile">目標達成に必要な目安<strong>${g.pace||'—'}語/日</strong></div></div><div class="card"><h2>今日の単語学習</h2>${next?`<p class="muted">次の未完了範囲</p><div class="metric" style="font-size:25px">No.${next.start}〜${Math.min(2500,next.start+Math.max(12,suggested)-1)}</div><p class="muted">今日の推奨：${m==='travel'?'お休み':m==='test'||m==='eiken'?'5〜12語でも十分':suggested+'語程度'}。紙の単語帳に○△×をつけてから、アプリで12語ブロックを完了にしてね。</p><button class="btn primary" onclick="goto('vocab')">単語の学習を記録する →</button>`:'<p>🎉 2500語の仕分け1周完了！</p>'}<p class="tiny">「完了」は仕分け済みの意味。暗記できた語数ではありません。</p></div>${weeklyGoalsHtml()}<div class="card"><h2>近い予定</h2>${eventList(upcoming)}<button class="btn soft small" onclick="goto('calendar')">カレンダーを見る</button></div>`}
function renderVocab(t){const todo=state.blocks.filter(b=>!b.done).slice(0,12),done=state.blocks.filter(b=>b.done).slice(-6).reverse();const block=(b,completed)=>`<button class="block ${completed?'done':t.next&&t.next.id===b.id?'next':''}" onclick="save('setBlock',{id:${b.id},done:${!completed}})"><b>No.${b.start}</b>〜${b.end}<br>${completed?'✓ 完了・取消':'□ 完了にする'}</button>`;$('vocab').innerHTML=`<div class="card"><h2>単語2500語・12語ずつ記録</h2><p class="muted">紙の単語帳で○△×をつけたら、学習した範囲をタップ。数える作業は不要！</p><div class="bar"><div style="width:${t.percent}%"></div></div><b class="kpi">${t.count} / 2500語（${t.percent}%）</b><h3>次の未完了ブロック</h3><div class="blockgrid">${todo.map(b=>block(b,false)).join('')||'すべて完了！'}</div><h3>最近完了したブロック（タップで取り消し）</h3><div class="blockgrid">${done.map(b=>block(b,true)).join('')||'<span class="muted">まだありません</span>'}</div></div><div class="card"><h2>番号を指定して記録</h2><label class="field">範囲<select id="blockSelect">${state.blocks.map(b=>`<option value="${b.id}">No.${b.start}〜${b.end} ${b.done?'✓':''}</option>`).join('')}</select></label><div class="rowbtns"><button class="btn primary" onclick="saveSelected(true)">完了にする</button><button class="btn light" onclick="saveSelected(false)">未完了に戻す</button></div></div>`}
function saveSelected(done){save('setBlock',{id:Number($('blockSelect').value),done})}
// Weekly targets are calculated from existing Skills records; no backend changes required.
const WEEKLY_GOALS={
 normal:[3,2,1,1,2,1],
 eiken:[2,0,0,0,5,0],
 test:[1,0,0,0,1,0],
 holiday:[3,2,1,1,2,1],
 travel:[0,0,0,0,0,0]
};
function weeklyProgress(){
 const now=new Date(today()+'T12:00:00');
 const offset=(now.getDay()+6)%7;
 const start=dayAdd(today(),-offset),end=dayAdd(start,6);
 // A skill counts at most once per study day, even if multiple records were saved.
 const counts=SKILLS.map(skill=>new Set((state.skills||[])
  .filter(x=>x.skill===skill&&normalizeDate(x.date)>=start&&normalizeDate(x.date)<=end)
  .map(x=>normalizeDate(x.date))).size);
 const mode=modeAt(today());
 const goals=WEEKLY_GOALS[mode]||WEEKLY_GOALS.normal;
 return {start,end,mode,counts,goals};
}
function weeklyGoalsHtml(){
 const w=weeklyProgress();
 const labels={normal:'通常期',eiken:'英検対策期',test:'定期テスト優先期',holiday:'長期休暇',travel:'旅行期間（目標なし）'};
 const rows=SKILLS.map((skill,i)=>{
  const target=w.goals[i],count=w.counts[i],pct=target?Math.min(100,Math.round(count/target*100)):0;
  return `<div style="margin:11px 0"><div class="flex"><span style="font-size:13px">${esc(skill)}</span><b style="font-size:13px;color:${target&&count>=target?'#237657':'#315f9f'}">${count} / ${target}回${target&&count>=target?' ✓':''}</b></div><div class="bar" style="height:7px;margin:6px 0"><div style="width:${pct}%"></div></div></div>`;
 }).join('');
 return `<div class="card"><div class="flex"><h2>今週の6分野チャレンジ</h2><span class="tag">${labels[w.mode]}</span></div><p class="muted">${shortDate(w.start)}〜${shortDate(w.end)} の目標。1日に同じ分野を複数回記録しても、達成回数は1回として数えるよ。</p>${rows}<p class="tiny">塾や学校での学習も記録してOK。目標は目安なので、忙しい週は無理せず調整しよう。</p><button class="btn primary" onclick="goto('skills')">✏️ 6分野の学習を記録する →</button></div>`;
}
function renderSkills(){const tiles=SKILLS.map(s=>{const a=state.skills.filter(x=>x.skill===s);return `<div class="tile"><div class="muted">${esc(s)}</div><strong>${a.length}回</strong><span class="tiny">合計 ${a.reduce((n,x)=>n+x.minutes,0)}分</span></div>`}).join('');$('skills').innerHTML=weeklyGoalsHtml()+`<div class="card"><h2>英語6分野の記録</h2><div class="grid">${tiles}</div></div><div class="card"><h2>学習したことを記録</h2><form id="skillForm"><label class="field">分野<select name="skill">${SKILLS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label class="field">学習日<input name="date" type="date" value="${today()}" required></label><label class="field">時間（分）<input name="minutes" type="number" min="1" max="240" value="15" required></label><label class="field">教材・テーマ（任意）<input name="topic" maxlength="120" placeholder="例：英検準2級 面接練習"></label><label class="field">気づき（任意）<textarea name="note" maxlength="300"></textarea></label><button class="btn primary">保存する</button></form></div><div class="card"><h2>最近の記録</h2>${state.skills.slice(-8).reverse().map(s=>`<div class="line"><b>${esc(s.skill)}</b>　${s.minutes}分 <span class="muted">${esc(s.date)}</span><div class="muted">${esc(s.topic)} ${esc(s.note)}</div></div>`).join('')||'<p class="muted">まだありません</p>'}</div>`;$('skillForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));save('addSkill',x)}}
function renderCalendar(){const d=new Date(today()+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+monthOffset);const y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),counts={};state.blocks.filter(b=>b.done).forEach(b=>{const k=b.at.slice(0,10);counts[k]=(counts[k]||0)+1});state.skills.forEach(s=>{counts[s.date]=(counts[s.date]||0)+1});let cells=['月','火','水','木','金','土','日'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('');for(let i=0;i<(d.getDay()+6)%7;i++)cells+='<div></div>';for(let i=1;i<=last;i++){const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');cells+=`<div title="${esc(currentEvents(key).map(x=>x.title).join('、'))}" class="day ${counts[key]?'studied':''} ${currentEvents(key).length?'event':''} ${key===today()?'today':''}">${i}${counts[key]?'<div>✓</div>':''}</div>`}const events=state.events.filter(e=>e.start<=iso(new Date(y,m+1,0))&&e.end>=iso(d)).sort((a,b)=>a.start.localeCompare(b.start));$('calendar').innerHTML=`<div class="card"><div class="flex"><button class="btn soft small" onclick="changeMonth(-1)">←</button><h2>${y}年${m+1}月</h2><button class="btn soft small" onclick="changeMonth(1)">→</button></div><div class="calendar">${cells}</div><p class="tiny">緑：学習記録あり／下線：予定あり</p></div><div class="card"><h2>この月の予定</h2>${eventList(events,50)}</div>${role==='parent'?`<div class="card parentOnly"><h2>予定を追加する（保護者用）</h2><form id="eventForm"><label class="field">予定名<input name="title" maxlength="80" required placeholder="例：模擬試験"></label><div class="grid"><label class="field">開始日<input name="start" type="date" required></label><label class="field">終了日<input name="end" type="date" required></label></div><label class="field">学習モード<select name="mode"><option value="exam">行事・試験日</option><option value="test">定期テスト優先</option><option value="eiken">英検優先</option><option value="holiday">長期休暇</option><option value="travel">旅行（ノルマ停止）</option><option value="normal">通常</option></select></label><label class="field">メモ<input name="detail" maxlength="200"></label><button class="btn primary">予定を追加</button></form><h3>予定の削除</h3>${events.map(e=>`<div class="line flex"><span class="muted">${esc(e.title)}</span><button class="btn light small" onclick="deleteEvent('${esc(e.id)}')">削除</button></div>`).join('')}</div>`:''}`;if($('eventForm'))$('eventForm').onsubmit=e=>{e.preventDefault();save('addEvent',Object.fromEntries(new FormData(e.target)))}}
function deleteEvent(id){if(confirm('この予定を削除しますか？'))save('deleteEvent',{id})}function changeMonth(n){monthOffset+=n;renderCalendar()}
function renderReview(){$('review').innerHTML=`<div class="card"><h2>週1回・親子で5分振り返り</h2><p class="muted">毎日の集計はしない。できたことを認めて、次週の重点を決めよう。</p><form id="reviewForm"><label class="field">振り返りの日<input type="date" name="week" value="${today()}" required></label><label class="field">今週できたこと<textarea name="good" maxlength="500" placeholder="例：はば単を120語仕分けた"></textarea></label><label class="field">来週の重点<textarea name="focus" maxlength="500" placeholder="例：面接の意見問題"></textarea></label><label class="field">メモ<textarea name="note" maxlength="500"></textarea></label><button class="btn primary">振り返りを保存</button></form></div><div class="card"><h2>これまでの振り返り</h2>${state.reviews.slice(-10).reverse().map(r=>`<div class="line"><b>${esc(r.week)}</b><div class="muted">できたこと：${esc(r.good)}</div><div class="muted">次の重点：${esc(r.focus)}</div><div class="muted">${esc(r.note)}</div></div>`).join('')||'<p class="muted">まだありません</p>'}</div>`;$('reviewForm').onsubmit=e=>{e.preventDefault();save('addReview',Object.fromEntries(new FormData(e.target)))}}
function renderParent(t,g){const skills=SKILLS.map(s=>{const a=state.skills.filter(x=>x.skill===s);return `<div class="line flex"><b>${esc(s)}</b><span>${a.length}回・${a.reduce((n,x)=>n+x.minutes,0)}分</span></div>`}).join('');const weekly=state.blocks.filter(b=>b.done&&b.at.slice(0,10)>=dayAdd(today(),-6)).reduce((n,b)=>n+b.end-b.start+1,0);$('parent').innerHTML=`<div class="card"><h2>保護者ダッシュボード</h2><div class="grid"><div class="tile">仕分け済み<strong>${t.count}語</strong></div><div class="tile">達成率<strong>${t.percent}%</strong></div><div class="tile">直近7日間<strong>${weekly}語</strong></div></div><div class="bar"><div style="width:${t.percent}%"></div></div><p class="muted">目標 2026年12月31日。これは仕分け進捗で、暗記率ではありません。</p><div class="notice">残り${g.remaining}語。通常・休暇の残り${g.days}日で達成するための計算上の目安は1日約${g.pace||'—'}語です。負担が大きければ期限・配分を見直しましょう。</div></div><div class="card"><h2>6分野の学習バランス</h2>${skills}</div><div class="card"><h2>直近の振り返り</h2>${state.reviews.slice(-3).reverse().map(r=>`<div class="line"><b>${esc(r.week)}</b><div class="muted">${esc(r.good)}</div><div class="muted">次の重点：${esc(r.focus)}</div></div>`).join('')||'<p class="muted">まだありません</p>'}</div><div class="card"><h2>予定の編集</h2><p class="muted">「予定」タブで行事・テスト期間を追加・削除できます。</p><button class="btn soft" onclick="goto('calendar')">予定を管理する</button></div><p class="tiny">保護者画面の切り替えは表示上の区別です。保護者専用の個別ログイン権限ではありません。合言葉を知る人は同じデータを操作できます。</p>`}
</script></body></html>
